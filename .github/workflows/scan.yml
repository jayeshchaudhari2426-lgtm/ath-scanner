name: Daily scan and deploy

on:
  schedule:
    # 12:07 UTC = 5:37 PM IST, Monday to Friday (after NSE close and end-of-day data)
    - cron: "7 12 * * 1-5"
  workflow_dispatch:      # "Run workflow" button for a manual refresh
  push:
    branches: [main]
    paths: ["site/**", "scan/**", ".github/workflows/**"]

permissions:
  contents: write         # to save positions.json (the trade log)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scan/requirements.txt

      - name: Install
        run: pip install -r scan/requirements.txt

      - name: Run scan
        run: python scan/scan.py

      - name: Save trade log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add positions.json intraday_trades.json scan/nifty500.csv
          git diff --cached --quiet || (git commit -m "Update trade log [skip ci]" && git push)

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
